<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>卡牌消消乐</title>
<style>
  /* ---------- 背景改成清爽渐变色 ---------- */
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Segoe UI', system-ui, sans-serif;
    color: #fff;
  }

  #game-container {
    background: rgba(255,255,255,0.06);
    backdrop-filter: blur(8px);
    border-radius: 32px;
    padding: 24px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    width: 480px;
    text-align: center;
  }

  #score-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }

  #score-bar span {
    font-size: 1.2rem;
    background: rgba(255,255,255,0.1);
    padding: 6px 14px;
    border-radius: 20px;
  }

  #level-target {
    font-size: 0.9rem;
    opacity: 0.8;
  }

  #board {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    gap: 4px;
    margin: 8px 0;
  }

  .cell {
    aspect-ratio: 1;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.8rem;
    cursor: pointer;
    transition: transform 0.12s, box-shadow 0.12s;
    background: rgba(255,255,255,0.1);
    user-select: none;
  }

  .cell.selected {
    border: 3px solid #f5c542;
    transform: scale(1.08);
    box-shadow: 0 0 16px #f5c542;
  }

  .cell.eliminated {
    animation: pop 0.3s ease forwards;
  }

  @keyframes pop {
    0%   { transform: scale(1); opacity: 1; }
    50%  { transform: scale(1.3); opacity: 0.6; }
    100% { transform: scale(0); opacity: 0; }
  }

  #message {
    margin-top: 12px;
    min-height: 1.8rem;
    font-size: 1rem;
  }

  button {
    background: rgba(255,255,255,0.15);
    border: none;
    color: #fff;
    padding: 10px 28px;
    border-radius: 30px;
    font-size: 1rem;
    cursor: pointer;
    margin-top: 12px;
    backdrop-filter: blur(4px);
    transition: background 0.2s;
  }
  button:hover {
    background: rgba(255,255,255,0.25);
  }

  .reward-msg {
    color: #fad64e;
    font-weight: bold;
  }

  .level-complete {
    color: #6dff6d;
    font-weight: bold;
    font-size: 1.4rem;
  }
</style>
</head>
<body>

<div id="game-container">
  <div id="score-bar">
    <span>🏆 <span id="scoreDisplay">0</span></span>
    <span id="level-target">目标: <span id="targetScore">100</span></span>
  </div>

  <div id="board"></div>

  <div id="message"></div>
  <button id="resetBtn">重新开始</button>
</div>

<script>
// ── 游戏配置 ──────────────────────────────────────
const ROWS = 8;
const COLS = 8;
const BASE_EMOJI = ['🍎','🍊','🍋','🍇','🍓','🍒','🍑','🥝'];

const SCORE_PER_MATCH = 10;
const CHAIN_BONUS = 15;            // 每次连锁额外奖励
const LEVEL_SCORES = [0, 100, 250, 500, 800, 1200]; // 官卡分数档

// ── 状态 ────────────────────────────────────────
let board = [];
let score = 0;
let currentLevel = 1;
let selectedCell = null;           // {row, col}
let swapInProgress = false;
let gameOver = false;

// DOM refs
const boardEl = document.getElementById('board');
const scoreEl = document.getElementById('scoreDisplay');
const targetEl = document.getElementById('targetScore');
const msgEl = document.getElementById('message');

function updateTarget() {
  const maxLevel = LEVEL_SCORES.length - 1;
  const level = Math.min(currentLevel, maxLevel);
  targetEl.textContent = LEVEL_SCORES[level];
}

// ── 棋盘初始化 ──────────────────────────────
function randomEmoji() {
  return BASE_EMOJI[Math.floor(Math.random() * BASE_EMOJI.length)];
}

function generateBoard() {
  board = [];
  for (let r = 0; r < ROWS; r++) {
    const row = [];
    for (let c = 0; c < COLS; c++) {
      // 避免初始时产生三个以上相同的（粗暴但够用）
      let emoji;
      do {
        emoji = randomEmoji();
      } while (
        (r >= 2 && board[r-1][c] === emoji && board[r-2][c] === emoji) ||
        (c >= 2 && row[c-1] === emoji && row[c-2] === emoji)
      );
      row.push(emoji);
    }
    board.push(row);
  }
}

// ── 查找可消除 ──────────────────────────────
function findMatches() {
  const matched = new Set();
  // 水平
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS - 2; c++) {
      if (board[r][c] && board[r][c+1] && board[r][c+2] &&
          board[r][c] === board[r][c+1] && board[r][c] === board[r][c+2]) {
        let end = c+2;
        while (end+1 < COLS && board[r][end+1] === board[r][c]) end++;
        for (let k = c; k <= end; k++) matched.add(`${r},${k}`);
        c = end; // 略过已检查
      }
    }
  }
  // 垂直
  for (let c = 0; c < COLS; c++) {
    for (let r = 0; r < ROWS - 2; r++) {
      if (board[r][c] && board[r+1][c] && board[r+2][c] &&
          board[r][c] === board[r+1][c] && board[r][c] === board[r+2][c]) {
        let end = r+2;
        while (end+1 < ROWS && board[end+1][c] === board[r][c]) end++;
        for (let k = r; k <= end; k++) matched.add(`${k},${c}`);
        r = end;
      }
    }
  }
  return matched;
}

// ── 重排下落 ──────────────────────────────
function applyGravity() {
  for (let c = 0; c < COLS; c++) {
    const colVals = [];
    for (let r = 0; r < ROWS; r++) {
      if (board[r][c]) colVals.push(board[r][c]);
    }
    // 从下往上填入
    for (let r = ROWS - 1; r >= 0; r--) {
      if (colVals.length) {
        board[r][c] = colVals.pop();
      } else {
        board[r][c] = randomEmoji();
      }
    }
  }
}

// ── 连锁消除 (含道具奖励判断) ──────────────
function cascade(chainCount = 0) {
  const matched = findMatches();
  if (matched.size === 0) return chainCount;

  // 消除动画（简化处理，视觉上直接重绘）
  const eliminatedPositions = [...matched];
  // 重置选中状态
  selectedCell = null;

  // 消除
  for (const pos of eliminatedPositions) {
    const [r, c] = pos.split(',').map(Number);
    board[r][c] = null;
  }

  // 计分：基本匹配分 + 连锁奖励
  const basePoints = eliminatedPositions.length * SCORE_PER_MATCH;
  const chainBonus = chainCount > 0 ? CHAIN_BONUS : 0;
  score += basePoints + chainBonus;
  updateScoreDisplay();

  // 道具奖励：每次连锁都有概率掉落「★」（道具）
  // 现存道具数（★）在棋盘上
  let rewardSpawned = false;
  const totalCells = ROWS * COLS;
  const currentItems = board.flat().filter(v => v !== null);
  const emptyCells = totalCells - currentItems.length;

  // 判定：如果有消除且是连续性（chainCount>=1）则给一个★
  if (chainCount >= 1 && emptyCells > 0) {
    // 找一个空位放★
    const emptyPositions = [];
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        if (board[r][c] === null) emptyPositions.push([r,c]);
      }
    }
    const [rr, cc] = emptyPositions[0];
    board[rr][cc] = '★';
    rewardSpawned = true;
  }

  // 显示消息（道具奖励）
  if (chainCount >= 1 && rewardSpawned) {
    msgEl.innerHTML = `<span class="reward-msg">🎁 连锁消除! 获得 ★ 道具!</span>`;
    setTimeout(() => { if (msgEl.innerHTML.includes('道具')) msgEl.innerHTML = ''; }, 1500);
  } else if (chainCount >= 1) {
    msgEl.innerHTML = `<span class="reward-msg">🔥 连锁 ${chainCount} 次!</span>`;
    setTimeout(() => { if (msgEl.innerHTML.includes('连锁')) msgEl.innerHTML = ''; }, 1500);
  }

  // 填补空位
  applyGravity();

  // 检查通关条件
  checkLevelComplete();

  // 递归继续消除
  return cascade(chainCount + 1);
}

function checkLevelComplete() {
  const maxLevel = LEVEL_SCORES.length - 1;
  const currentLevelTarget = LEVEL_SCORES[Math.min(currentLevel, maxLevel)];
  if (score >= currentLevelTarget && currentLevel < maxLevel) {
    currentLevel++;
    updateTarget();
    msgEl.innerHTML = `<span class="level-complete">🎉 通关！进入第 ${currentLevel} 关</span>`;
    setTimeout(() => msgEl.innerHTML = '', 2500);
    // 重置棋盘（新关卡）
    generateBoard();
    cascade();
    renderBoard();
  }
}

// ── 交换逻辑（支持相邻道具互换） ────────────
function swapAndMatch(r1, c1, r2, c2) {
  if (swapInProgress) return;
  swapInProgress = true;

  // 临时交换
  [board[r1][c1], board[r2][c2]] = [board[r2][c2], board[r1][c1]];

  // 检查是否形成消除
  const matched = findMatches();
  if (matched.size === 0) {
    // 不构成消除 -> 换回来
    [board[r1][c1], board[r2][c2]] = [board[r2][c2], board[r1][c1]];
    swapInProgress = false;
    renderBoard();
    return;
  }

  // 交换有效，开始连锁消除
  selectedCell = null;
  renderBoard();
  cascade();

  // 相邻道具互换（两个都是道具★）会产生更大消除（此处通过 cascade 自然处理）
  // 额外逻辑：如果交换的两个都是 '★'，则触发额外大消除（额外炸弹效果）
  if (board[r1][c1] === '★' && board[r2][c2] === '★') {
    // 炸掉周围3×3区域
    for (let dr = -1; dr <= 1; dr++) {
      for (let dc = -1; dc <= 1; dc++) {
        const nr = r1 + dr, nc = c1 + dc;
        if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && board[nr][nc] !== null) {
          board[nr][nc] = null;
        }
      }
    }
    // 同样对r2,c2区域爆破避免重复, r2,c2可能和r1,c1重合
    if (r1 !== r2 || c1 !== c2) {
      for (let dr = -1; dr <= 1; dr++) {
        for (let dc = -1; dc <= 1; dc++) {
          const nr = r2 + dr, nc = c2 + dc;
          if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && board[nr][nc] !== null) {
            board[nr][nc] = null;
          }
        }
      }
    }
    // 额外计分
    score += 50;
    updateScoreDisplay();
    msgEl.innerHTML = '<span class="reward-msg">💥 双道具爆炸!</span>';
    setTimeout(() => msgEl.innerHTML = '', 2000);
    applyGravity();
    cascade();
  }

  swapInProgress = false;
  renderBoard();
}

// ── UI 渲染 ──────────────────────────────
function renderBoard() {
  boardEl.innerHTML = '';
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.dataset.row = r;
      cell.dataset.col = c;
      cell.textContent = board[r][c] || '';
      if (selectedCell && selectedCell.row === r && selectedCell.col === c) {
        cell.classList.add('selected');
      }
      cell.addEventListener('click', () => handleCellClick(r, c));
      boardEl.appendChild(cell);
    }
  }
  updateScoreDisplay();
}

function updateScoreDisplay() {
  scoreEl.textContent = score;
}

function handleCellClick(r, c) {
  if (gameOver || swapInProgress) return;

  if (selectedCell === null) {
    selectedCell = { row: r, col: c };
    renderBoard();
    return;
  }

  const sr = selectedCell.row, sc = selectedCell.col;
  // 检查是否相邻（上下左右）
  const dr = Math.abs(r - sr);
  const dc = Math.abs(c - sc);
  if ((dr === 1 && dc === 0) || (dr === 0 && dc === 1)) {
    // 相邻交换（包括道具互换）
    swapAndMatch(sr, sc, r, c);
  } else {
    // 不是相邻 -> 重新选择
    selectedCell = { row: r, col: c };
    renderBoard();
  }
}

// ── 重置 ────────────────────────────────
function resetGame() {
  score = 0;
  currentLevel = 1;
  gameOver = false;
  selectedCell = null;
  swapInProgress = false;
  msgEl.innerHTML = '';
  updateTarget();
  generateBoard();
  // 去除初始匹配（简单处理消除一次）
  cascade();
  renderBoard();
}

document.getElementById('resetBtn').addEventListener('click', resetGame);

// 启动
resetGame();
</script>
</body>
</html>
