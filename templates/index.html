<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuclear Science Interactive</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header id="app-header">
        <h1>Nuclear Physics Explorer</h1>
        <nav id="main-nav">
            <a href="#fusion">Fusion</a>
            <a href="#fission">Fission</a>
            <a href="#quiz">Quiz</a>
        </nav>
        <div id="audio-controls">
            <label for="volume-slider">Volume</label>
            <input type="range" id="volume-slider" min="0" max="1" step="0.1" value="0.5">
            <button id="mute-toggle">Mute</button>
        </div>
    </header>
    <main id="app-main">
        <section id="fusion-section"></section>
        <section id="fission-section"></section>
        <section id="quiz-section"></section>
    </main>
    <script src="/static/js/audio.js"></script>
    <script src="/static/js/fusion.js"></script>
    <script src="/static/js/fission.js"></script>
    <script src="/static/js/quiz.js"></script>
    <script src="/static/js/main.js"></script>
</body>
</html>
