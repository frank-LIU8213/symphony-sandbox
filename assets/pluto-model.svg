<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <defs>
    <!-- Core gradient: rocky, warm tones -->
    <radialGradient id="core-grad" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ff8a6b"/>
      <stop offset="55%" stop-color="#cc4433"/>
      <stop offset="100%" stop-color="#661111"/>
    </radialGradient>

    <!-- Mantle gradient: icy blue-grey -->
    <radialGradient id="mantle-grad" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#7a9ab5"/>
      <stop offset="55%" stop-color="#4a6a8a"/>
      <stop offset="100%" stop-color="#1a3a5a"/>
    </radialGradient>

    <!-- Crust gradient: mixed ice/rock -->
    <radialGradient id="crust-grad" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#9baebf"/>
      <stop offset="55%" stop-color="#6b7d8f"/>
      <stop offset="100%" stop-color="#3b4d5f"/>
    </radialGradient>

    <!-- Glow filter for layer highlights -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Drop shadow for depth -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="rgba(0,0,0,0.5)"/>
    </filter>
  </defs>

  <!-- Starfield background -->
  <g class="pluto-stars">
    <circle cx="50" cy="80" r="1" fill="#fff" opacity="0.6"/>
    <circle cx="120" cy="45" r="0.8" fill="#fff" opacity="0.4"/>
    <circle cx="200" cy="150" r="1.2" fill="#fff" opacity="0.7"/>
    <circle cx="350" cy="30" r="0.6" fill="#fff" opacity="0.3"/>
    <circle cx="500" cy="90" r="1" fill="#fff" opacity="0.5"/>
    <circle cx="650" cy="60" r="0.9" fill="#fff" opacity="0.4"/>
    <circle cx="720" cy="180" r="1.1" fill="#fff" opacity="0.6"/>
    <circle cx="80" cy="300" r="0.7" fill="#fff" opacity="0.3"/>
    <circle cx="150" cy="500" r="1" fill="#fff" opacity="0.5"/>
    <circle cx="250" cy="650" r="0.8" fill="#fff" opacity="0.4"/>
    <circle cx="400" cy="720" r="1.2" fill="#fff" opacity="0.6"/>
    <circle cx="550" cy="680" r="0.6" fill="#fff" opacity="0.3"/>
    <circle cx="700" cy="550" r="1" fill="#fff" opacity="0.5"/>
    <circle cx="750" cy="350" r="0.9" fill="#fff" opacity="0.4"/>
    <circle cx="600" cy="200" r="0.7" fill="#fff" opacity="0.3"/>
    <circle cx="300" cy="250" r="1.1" fill="#fff" opacity="0.5"/>
    <circle cx="450" cy="150" r="0.8" fill="#fff" opacity="0.4"/>
    <circle cx="100" cy="600" r="1" fill="#fff" opacity="0.6"/>
    <circle cx="680" cy="700" r="0.6" fill="#fff" opacity="0.3"/>
    <circle cx="50" cy="450" r="0.9" fill="#fff" opacity="0.5"/>
  </g>

  <!-- Orbit rings -->
  <g class="pluto-orbits">
    <circle cx="400" cy="400" r="230" fill="none" stroke="#00d4ff" stroke-width="0.8" stroke-dasharray="4 8" opacity="0.25"/>
    <circle cx="400" cy="400" r="270" fill="none" stroke="#00d4ff" stroke-width="0.8" stroke-dasharray="6 12" opacity="0.2"/>
    <circle cx="400" cy="400" r="310" fill="none" stroke="#00d4ff" stroke-width="0.8" stroke-dasharray="8 16" opacity="0.15"/>
  </g>

  <!-- Rotating Pluto layers -->
  <g class="pluto-layers">
    <!-- Core: rocky metal center -->
    <circle class="pluto-layer pluto-layer-core" data-layer="core"
            cx="400" cy="400" r="75"
            fill="url(#core-grad)"
            style="cursor: pointer"/>

    <!-- Mantle: water ice / ammonia hydrate -->
    <circle class="pluto-layer pluto-layer-mantle" data-layer="mantle"
            cx="400" cy="400" r="135"
            fill="url(#mantle-grad)"
            style="cursor: pointer"/>

    <!-- Crust: water ice + rock -->
    <circle class="pluto-layer pluto-layer-crust" data-layer="crust"
            cx="400" cy="400" r="195"
            fill="url(#crust-grad)"
            style="cursor: pointer"/>

    <!-- Surface craters -->
    <g class="pluto-craters">
      <circle cx="340" cy="320" r="12" fill="rgba(0,0,0,0.15)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <circle cx="460" cy="380" r="8" fill="rgba(0,0,0,0.15)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <circle cx="380" cy="480" r="15" fill="rgba(0,0,0,0.15)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <circle cx="440" cy="300" r="6" fill="rgba(0,0,0,0.15)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <circle cx="300" cy="420" r="10" fill="rgba(0,0,0,0.15)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <circle cx="500" cy="440" r="7" fill="rgba(0,0,0,0.15)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <circle cx="360" cy="260" r="9" fill="rgba(0,0,0,0.15)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <circle cx="480" cy="500" r="11" fill="rgba(0,0,0,0.15)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    </g>
  </g>

  <!-- Labels with leader lines -->
  <g class="pluto-labels">
    <!-- Core label -->
    <line x1="347" y1="347" x2="320" y2="320" stroke="#00d4ff" stroke-width="0.8" opacity="0.4"/>
    <circle cx="347" cy="347" r="2.5" fill="#00d4ff" opacity="0.6"/>
    <text x="320" y="320" fill="#00d4ff" font-size="13" font-family="monospace" text-anchor="end" dominant-baseline="middle" class="pluto-label pluto-label-core" pointer-events="none">Core</text>

    <!-- Mantle label -->
    <line x1="493" y1="493" x2="530" y2="530" stroke="#00d4ff" stroke-width="0.8" opacity="0.4"/>
    <circle cx="493" cy="493" r="2.5" fill="#00d4ff" opacity="0.6"/>
    <text x="530" y="493" fill="#00d4ff" font-size="13" font-family="monospace" text-anchor="start" dominant-baseline="middle" class="pluto-label pluto-label-mantle" pointer-events="none">Mantle</text>

    <!-- Crust label -->
    <line x1="262" y1="538" x2="220" y2="580" stroke="#00d4ff" stroke-width="0.8" opacity="0.4"/>
    <circle cx="262" cy="538" r="2.5" fill="#00d4ff" opacity="0.6"/>
    <text x="220" y="538" fill="#00d4ff" font-size="13" font-family="monospace" text-anchor="end" dominant-baseline="middle" class="pluto-label pluto-label-crust" pointer-events="none">Crust</text>
  </g>

  <!-- HUD overlay: top-left info panel -->
  <g class="pluto-hud" transform="translate(20, 20)">
    <rect width="180" height="80" rx="4" fill="rgba(0, 212, 255, 0.08)" stroke="rgba(0, 212, 255, 0.3)" stroke-width="0.5"/>
    <text x="12" y="22" fill="#00d4ff" font-size="11" font-family="monospace" letter-spacing="2">PLUTO</text>
    <text x="12" y="40" fill="rgba(224, 230, 237, 0.6)" font-size="9" font-family="monospace">Dwarf Planet · Kuiper Belt</text>
    <text x="12" y="58" fill="rgba(224, 230, 237, 0.5)" font-size="9" font-family="monospace">Radius: 1188.3 km</text>
  </g>

  <!-- HUD overlay: bottom-right rotation indicator -->
  <g class="pluto-hud" transform="translate(660, 720)">
    <circle cx="0" cy="0" r="18" fill="none" stroke="rgba(0, 212, 255, 0.3)" stroke-width="0.8" stroke-dasharray="4 3"/>
    <text x="0" y="3" fill="rgba(0, 212, 255, 0.5)" font-size="8" font-family="monospace" text-anchor="middle">ROT</text>
  </g>
</svg>
