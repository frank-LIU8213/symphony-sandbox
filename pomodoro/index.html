<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pomodoro</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="pm-background-layer"></div>
  <div class="pm-container">
    <header>
      <h1 class="pm-title">Focus Timer</h1>
    </header>
    <main>
      <div class="pm-timer">
        <div class="pm-svg-ring" id="pm-ring-container">
          <!-- SVG ring will be injected by visuals.js -->
        </div>
        <div class="pm-time-display" id="pm-time-display">25:00</div>
        <div class="pm-mode-indicator" id="pm-mode-indicator">Work</div>
      </div>
      <div class="pm-controls">
        <button id="pm-start-btn" class="pm-btn">Start</button>
        <button id="pm-pause-btn" class="pm-btn">Pause</button>
        <button id="pm-reset-btn" class="pm-btn">Reset</button>
        <button id="pm-skip-btn" class="pm-btn">Skip</button>
      </div>
      <div class="pm-settings-toggle" id="pm-settings-toggle" aria-expanded="false" tabindex="0">Settings</div>
      <div class="pm-settings" id="pm-settings" aria-hidden="true">
        <label for="pm-work-duration">Work (min)</label>
        <input type="number" id="pm-work-duration" min="1" max="90" value="25">
        <label for="pm-break-duration">Break (min)</label>
        <input type="number" id="pm-break-duration" min="1" max="30" value="5">
        <label for="pm-sound-toggle">Sound</label>
        <input type="checkbox" id="pm-sound-toggle" checked>
        <label for="pm-theme-select">Background Theme</label>
        <select id="pm-theme-select">
          <option value="default">Default</option>
          <option value="nature">Nature</option>
          <option value="abstract">Abstract</option>
        </select>
        <button id="pm-save-settings" class="pm-btn">Save</button>
      </div>
    </main>
  </div>
  <script type="module" src="timer.js"></script>
  <script type="module" src="visuals.js"></script>
  <script type="module" src="sound.js"></script>
  <script type="module" src="settings.js"></script>
  <script type="module" src="background.js"></script>
</body>
</html>
