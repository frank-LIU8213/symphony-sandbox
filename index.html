<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Power Snake — 炫酷贪食蛇</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Courier New', monospace;
            overflow: hidden;
            position: relative;
        }
        /* SVG background animation */
        .bg-svg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: -1;
        }
        .rotating-ring {
            animation: spin 12s linear infinite;
            transform-origin: 50% 50%;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .pulse-ring {
            animation: pulse 3s ease-in-out infinite;
            transform-origin: 50% 50%;
        }
        @keyframes pulse {
            0%, 100% { r: 120; opacity: 0.15; }
            50% { r: 180; opacity: 0.25; }
        }
        canvas {
            border: 2px solid #333;
            box-shadow: 0 0 40px rgba(0,255,100,0.3);
            display: block;
            position: relative;
            z-index: 1;
        }
    </style>
</head>
<body>
    <!-- Animated SVG background -->
    <svg class="bg-svg" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice">
        <defs>
            <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#0f0f1a"/>
                <stop offset="100%" stop-color="#1a0f0f"/>
            </linearGradient>
            <radialGradient id="glow-grad" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="rgba(0,255,100,0.08)"/>
                <stop offset="100%" stop-color="rgba(0,255,100,0)"/>
            </radialGradient>
        </defs>
        <rect width="100" height="100" fill="url(#bg-grad)"/>
        <circle class="pulse-ring" cx="50" cy="50" r="120"
                fill="none" stroke="rgba(0,255,100,0.15)" stroke-width="1"/>
        <g class="rotating-ring">
            <circle cx="50" cy="50" r="180"
                    fill="none" stroke="rgba(255,165,0,0.08)" stroke-width="2"
                    stroke-dasharray="40 160"/>
            <circle cx="50" cy="50" r="220"
                    fill="none" stroke="rgba(0,255,255,0.06)" stroke-width="1"
                    stroke-dasharray="80 320"/>
        </g>
        <circle cx="50" cy="50" r="100" fill="url(#glow-grad)"/>
    </svg>

    <canvas id="game"></canvas>
    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');

        const TILE_COUNT = 20;
        const CELL_SIZE = 40;           // increased from 30 → better detail
        const CANVAS_SIZE = TILE_COUNT * CELL_SIZE;
        canvas.width = CANVAS_SIZE;
        canvas.height = CANVAS_SIZE;

        const BASE_SPEED = 130;          // ms per move
        const ABILITY_DURATION = 5000;   // 5 seconds

        // ---------- game state ----------
        let snake = [
            { x: 10, y: 10 },
            { x: 9, y: 10 },
            { x: 8, y: 10 }
        ];
        let direction = { x: 1, y: 0 };
        let nextDirection = { x: 1, y: 0 };

        let food = null;
        let score = 0;
        let gameRunning = true;
        let moveAccum = 0;

        // ability timers (Date.now())
        let speedEnd = 0;
        let invincibleEnd = 0;
        let scoreX2End = 0;

        let particles = [];

        // food rotation angle (per frame)
        let foodAngle = 0;

        let lastTime = performance.now();

        // ---------- food ----------
        const FOOD_TYPES = ['speed', 'invincible', 'shrink', 'grow', 'score2x'];
        const FOOD_COLORS = ['#FFA500', '#00FFFF', '#FF4444', '#44FF44', '#FFD700'];

        function spawnFood() {
            const idx = Math.floor(Math.random() * FOOD_TYPES.length);
            let pos;
            do {
                pos = {
                    x: Math.floor(Math.random() * TILE_COUNT),
                    y: Math.floor(Math.random() * TILE_COUNT)
                };
            } while (snake.some(seg => seg.x === pos.x && seg.y === pos.y));
            food = {
                x: pos.x,
                y: pos.y,
                type: FOOD_TYPES[idx],
                color: FOOD_COLORS[idx]
            };
        }
        spawnFood();

        // ---------- restart ----------
        function restart() {
            snake = [
                { x: 10, y: 10 },
                { x: 9, y: 10 },
                { x: 8, y: 10 }
            ];
            direction = { x: 1, y: 0 };
            nextDirection = { x: 1, y: 0 };
            score = 0;
            gameRunning = true;
            moveAccum = 0;
            speedEnd = 0;
            invincibleEnd = 0;
            scoreX2End = 0;
            particles = [];
            foodAngle = 0;
            spawnFood();
            lastTime = performance.now();
        }

        // ---------- particles ----------
        function spawnParticles(x, y, color) {
            const cx = x * CELL_SIZE + CELL_SIZE / 2;
            const cy = y * CELL_SIZE + CELL_SIZE / 2;
            for (let i = 0; i < 20; i++) {
                particles.push({
                    x: cx,
                    y: cy,
                    vx: (Math.random() - 0.5) * 6,
                    vy: (Math.random() - 0.5) * 6,
                    life: 1,
                    color
                });
            }
        }

        // ---------- abilities ----------
        function applyFoodEffect(type) {
            let points = 10;
            if (Date.now() < scoreX2End) points *= 2;
            score += points;

            switch (type) {
                case 'speed':
                    speedEnd = Date.now() + ABILITY_DURATION;
                    break;
                case 'invincible':
                    invincibleEnd = Date.now() + ABILITY_DURATION;
                    break;
                case 'shrink':
                    if (snake.length > 1) {
                        const removeCount = Math.min(
                            snake.length - 1,
                            Math.floor(snake.length / 2)
                        );
                        snake.splice(-removeCount);
                    }
                    break;
                case 'grow':
                    {
                        const last = snake[snake.length - 1];
                        for (let i = 0; i < 3; i++) {
                            snake.push({ ...last });
                        }
                    }
                    break;
                case 'score2x':
                    scoreX2End = Date.now() + ABILITY_DURATION;
                    break;
                default: break;
            }
        }

        // ---------- move ----------
        function move() {
            direction = { ...nextDirection };
            const head = {
                x: snake[0].x + direction.x,
                y: snake[0].y + direction.y
            };

            const invincible = Date.now() < invincibleEnd;

            if (!invincible) {
                if (
                    head.x < 0 || head.x >= TILE_COUNT ||
                    head.y < 0 || head.y >= TILE_COUNT
                ) {
                    gameRunning = false;
                    return;
                }
                if (snake.some(seg => seg.x === head.x && seg.y === head.y)) {
                    gameRunning = false;
                    return;
                }
            }

            snake.unshift(head);

            if (food && head.x === food.x && head.y === food.y) {
                applyFoodEffect(food.type);
                spawnParticles(food.x, food.y, food.color);
                spawnFood();
            } else {
                snake.pop();
            }
        }

        // ---------- food drawing helpers ----------
        function drawLightning(cx, cy, r, color) {
            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(foodAngle * 0.5);
            ctx.fillStyle = color;
            ctx.shadowColor = color;
            ctx.shadowBlur = 20;
            ctx.beginPath();
            // simple lightning shape
            ctx.moveTo(0, -r);
            ctx.lineTo(-r * 0.3, 0);
            ctx.lineTo(r * 0.05, 0);
            ctx.lineTo(0, r);
            ctx.lineTo(r * 0.4, -r * 0.2);
            ctx.lineTo(-r * 0.1, -r * 0.2);
            ctx.closePath();
            ctx.fill();
            ctx.restore();
        }

        function drawStar(cx, cy, r, color) {
            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(foodAngle * 0.3);
            ctx.fillStyle = color;
            ctx.shadowColor = color;
            ctx.shadowBlur = 25;
            ctx.beginPath();
            const spikes = 5;
            const outerR = r;
            const innerR = r * 0.4;
            for (let i = 0; i < spikes * 2; i++) {
                const angle = (i * Math.PI) / spikes - Math.PI / 2;
                const radius = i % 2 === 0 ? outerR : innerR;
                const px = Math.cos(angle) * radius;
                const py = Math.sin(angle) * radius;
                if (i === 0) ctx.moveTo(px, py);
                else ctx.lineTo(px, py);
            }
            ctx.closePath();
            ctx.fill();
            ctx.restore();
        }

        function drawShrink(cx, cy, r, color) {
            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(foodAngle * 0.2);
            ctx.fillStyle = color;
            ctx.shadowColor = color;
            ctx.shadowBlur = 18;
            const arrowSize = r * 0.5;
            // left arrow
            ctx.beginPath();
            ctx.moveTo(-arrowSize, 0);
            ctx.lineTo(-arrowSize - arrowSize * 0.7, 0);
            ctx.lineTo(-arrowSize * 0.5, -arrowSize * 0.5);
            ctx.closePath();
            ctx.fill();
            // right arrow
            ctx.beginPath();
            ctx.moveTo(arrowSize, 0);
            ctx.lineTo(arrowSize + arrowSize * 0.7, 0);
            ctx.lineTo(arrowSize * 0.5, -arrowSize * 0.5);
            ctx.closePath();
            ctx.fill();
            // connecting line
            ctx.fillRect(-arrowSize, -1, arrowSize * 2, 2);
            ctx.restore();
        }

        function drawGrow(cx, cy, r, color) {
            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(foodAngle * 0.4);
            ctx.fillStyle = color;
            ctx.shadowColor = color;
            ctx.shadowBlur = 20;
            const thickness = r * 0.35;
            const length = r * 1.2;
            ctx.fillRect(-thickness / 2, -length / 2, thickness, length);
            ctx.fillRect(-length / 2, -thickness / 2, length, thickness);
            ctx.restore();
        }

        function drawScore2X(cx, cy, r, color) {
            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(foodAngle * 0.1);
            ctx.fillStyle = color;
            ctx.shadowColor = color;
            ctx.shadowBlur = 20;
            ctx.font = `bold ${r * 1.2}px "Courier New", monospace`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('2×', 0, 0);
            ctx.restore();
        }

        function drawFood(food) {
            const cx = food.x * CELL_SIZE + CELL_SIZE / 2;
            const cy = food.y * CELL_SIZE + CELL_SIZE / 2;
            const r = CELL_SIZE * 0.35;

            switch (food.type) {
                case 'speed':
                    drawLightning(cx, cy, r, food.color);
                    break;
                case 'invincible':
                    drawStar(cx, cy, r, food.color);
                    break;
                case 'shrink':
                    drawShrink(cx, cy, r, food.color);
                    break;
                case 'grow':
                    drawGrow(cx, cy, r, food.color);
                    break;
                case 'score2x':
                    drawScore2X(cx, cy, r, food.color);
                    break;
                default:
                    // fallback circle
                    ctx.save();
                    ctx.fillStyle = food.color;
                    ctx.shadowColor = food.color;
                    ctx.shadowBlur = 14;
                    ctx.beginPath();
                    ctx.arc(cx, cy, CELL_SIZE / 2.5, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
            }
        }

        // ---------- update ----------
        function update(dt) {
            if (!gameRunning) return;

            moveAccum += dt;
            const currentSpeed =
                Date.now() < speedEnd ? BASE_SPEED * 0.5 : BASE_SPEED;

            while (moveAccum >= currentSpeed) {
                moveAccum -= currentSpeed;
                move();
                if (!gameRunning) break;
            }

            // food rotation
            foodAngle += dt * 0.003;

            // particles
            particles = particles.filter(p => p.life > 0);
            particles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.02;
            });
        }

        // ---------- draw snake head detail ----------
        function drawSnakeHead(x, y) {
            const cx = x * CELL_SIZE + CELL_SIZE / 2;
            const cy = y * CELL_SIZE + CELL_SIZE / 2;
            ctx.save();
            const invincible = Date.now() < invincibleEnd;
            if (invincible) {
                const hue = (Date.now() / 100) % 360;
                ctx.fillStyle = `hsl(${hue}, 100%, 50%)`;
            } else {
                ctx.fillStyle = 'rgb(0,255,100)';
            }
            ctx.shadowColor = ctx.fillStyle;
            ctx.shadowBlur = 15;
            // rounded head (circle)
            ctx.beginPath();
            ctx.arc(cx, cy, CELL_SIZE * 0.4, 0, Math.PI * 2);
            ctx.fill();
            // eyes
            const eyeOff = CELL_SIZE * 0.13;
            const eyeR = CELL_SIZE * 0.08;
            ctx.fillStyle = '#fff';
            ctx.shadowBlur = 0;
            ctx.beginPath();
            ctx.arc(cx - eyeOff, cy - eyeOff * 0.5, eyeR, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(cx + eyeOff, cy - eyeOff * 0.5, eyeR, 0, Math.PI * 2);
            ctx.fill();
            // pupils
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(cx - eyeOff, cy - eyeOff * 0.5, eyeR * 0.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(cx + eyeOff, cy - eyeOff * 0.5, eyeR * 0.5, 0, Math.PI * 2);
            ctx.fill();
            // tongue (small red line)
            if (direction.x !== 0 || direction.y !== 0) {
                const tongueLen = CELL_SIZE * 0.25;
                let tx, ty;
                if (direction.x === 1) { tx = cx + CELL_SIZE * 0.45; ty = cy; }
                else if (direction.x === -1) { tx = cx - CELL_SIZE * 0.45; ty = cy; }
                else if (direction.y === 1) { tx = cx; ty = cy + CELL_SIZE * 0.45; }
                else { tx = cx; ty = cy - CELL_SIZE * 0.45; }
                ctx.strokeStyle = '#ff4444';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.lineTo(tx, ty);
                // forked
                const forkAngle = direction.x !== 0 ? 0.8 : (direction.y > 0 ? -0.8 : 0.8);
                ctx.moveTo(tx, ty);
                const f1x = tx + Math.cos(forkAngle) * tongueLen * 0.5;
                const f1y = ty + Math.sin(forkAngle) * tongueLen * 0.5;
                ctx.lineTo(f1x, f1y);
                ctx.moveTo(tx, ty);
                const f2x = tx + Math.cos(-forkAngle) * tongueLen * 0.5;
                const f2y = ty + Math.sin(-forkAngle) * tongueLen * 0.5;
                ctx.lineTo(f2x, f2y);
                ctx.stroke();
            }
            ctx.restore();
        }

        // ---------- draw ----------
        function draw() {
            ctx.clearRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);

            // faint grid (dashed)
            ctx.strokeStyle = '#1a1a1a';
            ctx.lineWidth = 1;
            ctx.setLineDash([4, 6]);
            for (let i = 0; i <= TILE_COUNT; i++) {
                ctx.beginPath();
                ctx.moveTo(i * CELL_SIZE, 0);
                ctx.lineTo(i * CELL_SIZE, CANVAS_SIZE);
                ctx.stroke();

                ctx.moveTo(0, i * CELL_SIZE);
                ctx.lineTo(CANVAS_SIZE, i * CELL_SIZE);
                ctx.stroke();
            }
            ctx.setLineDash([]);

            // food (drawn with distinct shapes)
            if (food) {
                drawFood(food);
            }

            // snake body
            snake.forEach((seg, idx) => {
                if (idx === 0) return; // head drawn separately
                ctx.save();
                const invincible = Date.now() < invincibleEnd;
                const speedActive = Date.now() < speedEnd;

                let baseColor;
                if (invincible) {
                    const hue = (Date.now() / 100) % 360;
                    baseColor = `hsl(${hue}, 100%, 50%)`;
                } else if (speedActive) {
                    baseColor = 'rgb(255,165,0)';
                } else {
                    baseColor = 'rgb(0,255,100)';
                }

                const alpha = Math.max(0.2, 1 - idx * 0.03);
                ctx.fillStyle = baseColor.replace(')', `,${alpha})`).replace('hsl', 'hsla');
                ctx.shadowColor = ctx.fillStyle;
                ctx.shadowBlur = 8;

                // rounded rectangle segments
                const x = seg.x * CELL_SIZE + 3;
                const y = seg.y * CELL_SIZE + 3;
                const w = CELL_SIZE - 6;
                const h = CELL_SIZE - 6;
                const corner = 5;
                ctx.beginPath();
                ctx.moveTo(x + corner, y);
                ctx.lineTo(x + w - corner, y);
                ctx.quadraticCurveTo(x + w, y, x + w, y + corner);
                ctx.lineTo(x + w, y + h - corner);
                ctx.quadraticCurveTo(x + w, y + h, x + w - corner, y + h);
                ctx.lineTo(x + corner, y + h);
                ctx.quadraticCurveTo(x, y + h, x, y + h - corner);
                ctx.lineTo(x, y + corner);
                ctx.quadraticCurveTo(x, y, x + corner, y);
                ctx.closePath();
                ctx.fill();
                ctx.restore();
            });

            // snake head
            if (snake.length > 0) {
                drawSnakeHead(snake[0].x, snake[0].y);
            }

            // particles
            particles.forEach(p => {
                ctx.save();
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.shadowColor = p.color;
                ctx.shadowBlur = 10;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });

            // ---------- HUD ----------
            ctx.save();
            ctx.shadowColor = 'rgba(0,0,0,0.5)';
            ctx.shadowBlur = 6;
            ctx.fillStyle = '#fff';
            ctx.font = '22px "Courier New", monospace';
            ctx.textAlign = 'left';
            ctx.fillText(`Score: ${score}`, 12, 32);

            let yOffset = 64;
            const activeEffects = [];
            if (Date.now() < speedEnd) activeEffects.push({ label: 'SPEED', color: '#FFA500' });
            if (Date.now() < invincibleEnd) activeEffects.push({ label: 'INVINCIBLE', color: '#00FFFF' });
            if (Date.now() < scoreX2End) activeEffects.push({ label: 'SCORE2X', color: '#FFD700' });

            ctx.font = '18px "Courier New", monospace';
            activeEffects.forEach(ef => {
                ctx.fillStyle = ef.color;
                ctx.fillText(ef.label, 12, yOffset);
                yOffset += 22;
            });
            ctx.restore();

            // game‑over overlay
            if (!gameRunning) {
                ctx.save();
                ctx.fillStyle = 'rgba(0,0,0,0.75)';
                ctx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);

                ctx.fillStyle = '#fff';
                ctx.font = '36px "Courier New", monospace';
                ctx.textAlign = 'center';
                ctx.fillText('GAME OVER', CANVAS_SIZE / 2, CANVAS_SIZE / 2 - 20);

                ctx.font = '22px "Courier New", monospace';
                ctx.fillText('Press Space or Enter to restart', CANVAS_SIZE / 2, CANVAS_SIZE / 2 + 24);
                ctx.textAlign = 'start';
                ctx.restore();
            }
        }

        // ---------- keyboard ----------
        window.addEventListener('keydown', e => {
            if (!gameRunning) {
                if (e.key === ' ' || e.key === 'Enter') {
                    restart();
                }
                return;
            }

            switch (e.key) {
                case 'ArrowUp': case 'w':
                    if (direction.y === 0) nextDirection = { x: 0, y: -1 };
                    break;
                case 'ArrowDown': case 's':
                    if (direction.y === 0) nextDirection = { x: 0, y: 1 };
                    break;
                case 'ArrowLeft': case 'a':
                    if (direction.x === 0) nextDirection = { x: -1, y: 0 };
                    break;
                case 'ArrowRight': case 'd':
                    if (direction.x === 0) nextDirection = { x: 1, y: 0 };
                    break;
                default: break;
            }
        });

        // prevent page scroll on arrow keys
        window.addEventListener('keydown', e => {
            if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) {
                e.preventDefault();
            }
        }, { passive: false });

        // ---------- game loop ----------
        function gameLoop(now) {
            const dt = now - lastTime;
            lastTime = now;
            update(dt);
            draw();
            requestAnimationFrame(gameLoop);
        }
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
