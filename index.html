<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>2046</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    touch-action: manipulation;
    user-select: none;
  }
  body {
    background: linear-gradient(145deg, #f5eee3 0%, #e8dcc0 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    color: #776e65;
    padding: 16px;
  }
  #app {
    max-width: 500px;
    width: 100%;
    background: #bbada0;
    border-radius: 20px;
    padding: 24px 24px 20px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.25);
    position: relative;
  }
  h1 {
    font-size: 42px;
    font-weight: 800;
    letter-spacing: 2px;
    color: #776e65;
    line-height: 1;
    display: inline-block;
    margin-bottom: 8px;
    text-shadow: 1px 1px 0 rgba(255,255,255,0.6);
  }
  #top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    flex-wrap: wrap;
    gap: 8px;
  }
  .score-box {
    background: #cdc1b4;
    border-radius: 8px;
    padding: 6px 16px;
    text-align: center;
    min-width: 80px;
  }
  .score-label {
    font-size: 12px;
    text-transform: uppercase;
    color: #8f7a66;
    letter-spacing: 1px;
  }
  .score-value {
    font-size: 24px;
    font-weight: 700;
    color: #776e65;
    line-height: 1.2;
  }
  #grid-container {
    position: relative;
    background: #bbada0;
    border-radius: 8px;
    padding: 8px;
    margin-bottom: 12px;
    aspect-ratio: 1 / 1;
    width: 100%;
  }
  #grid {
    position: relative;
    width: 100%;
    height: 100%;
  }
  .tile {
    position: absolute;
    border-radius: 6px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-weight: 700;
    font-size: 24px;
    color: #776e65;
    transition: left 0.12s ease, top 0.12s ease, opacity 0.15s ease;
    z-index: 1;
    white-space: nowrap;
    overflow: hidden;
  }
  .tile-new {
    animation: popIn 0.2s ease;
  }
  @keyframes popIn {
    0% { transform: scale(0); opacity: 0; }
    50% { transform: scale(1.15); }
    100% { transform: scale(1); opacity: 1; }
  }
  .tile-merge {
    animation: popMerge 0.2s ease;
  }
  @keyframes popMerge {
    0% { transform: scale(1); }
    50% { transform: scale(1.2); }
    100% { transform: scale(1); }
  }
  #controls {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    justify-content: center;
    margin-bottom: 8px;
  }
  #controls button, #levelSelect {
    padding: 8px 16px;
    border: none;
    border-radius: 8px;
    background: #8f7a66;
    color: #f9f6f2;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    outline: none;
    transition: background 0.2s, transform 0.1s;
    box-shadow: 0 3px 0 #6b5b4f;
  }
  #controls button:active {
    transform: translateY(2px);
    box-shadow: 0 1px 0 #6b5b4f;
  }
  #controls button:hover:not(:disabled) {
    background: #9f8b76;
  }
  #levelSelect {
    background: #cdc1b4;
    color: #776e65;
    box-shadow: 0 3px 0 #b0a394;
    min-width: 140px;
  }
  #message {
    text-align: center;
    font-size: 18px;
    font-weight: 700;
    color: #776e65;
    min-height: 28px;
    line-height: 28px;
  }
  #gameOver {
    display: none;
    position: absolute;
    inset: 0;
    background: rgba(238,228,218,0.73);
    border-radius: 8px;
    z-index: 10;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    gap: 12px;
    backdrop-filter: blur(4px);
  }
  #gameOver.show {
    display: flex;
  }
  #gameOver h2 {
    font-size: 38px;
    font-weight: 900;
    color: #776e65;
    text-shadow: 0 2px 4px rgba(255,255,255,0.5);
  }
  #gameOver .restart-btn {
    padding: 12px 32px;
    border: none;
    border-radius: 10px;
    background: #8f7a66;
    color: #f9f6f2;
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 4px 0 #6b5b4f;
    transition: 0.1s;
  }
  #gameOver .restart-btn:active {
    transform: translateY(2px);
    box-shadow: 0 2px 0 #6b5b4f;
  }
  /* 方向按钮区域 */
  #dir-controls {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    margin-bottom: 8px;
    margin-top: 4px;
  }
  #dir-controls .row {
    display: flex;
    gap: 6px;
  }
  .dir-btn {
    width: 64px;
    height: 64px;
    border: none;
    border-radius: 12px;
    background: #8f7a66;
    color: #f9f6f2;
    font-size: 28px;
    font-weight: 700;
    cursor: pointer;
    outline: none;
    box-shadow: 0 4px 0 #6b5b4f;
    transition: background 0.2s, transform 0.1s;
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: manipulation;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .dir-btn:active {
    transform: translateY(2px);
    box-shadow: 0 2px 0 #6b5b4f;
  }
  .dir-btn:hover:not(:disabled) {
    background: #9f8b76;
  }
  .dir-btn:disabled {
    opacity: 0.4;
    cursor: default;
    box-shadow: 0 2px 0 #6b5b4f;
    transform: translateY(2px);
  }
  @media (max-width: 400px) {
    h1 { font-size: 32px; }
    .score-value { font-size: 20px; }
    #controls button, #levelSelect { font-size: 13px; padding: 6px 12px; }
    #app { padding: 16px 16px 12px; }
    .dir-btn { width: 52px; height: 52px; font-size: 22px; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="top-bar">
    <h1>2046</h1>
    <div style="display:flex; gap:8px;">
      <div class="score-box"><div class="score-label">得分</div><div class="score-value" id="scoreDisplay">0</div></div>
      <div class="score-box"><div class="score-label">最高</div><div class="score-value" id="bestDisplay">0</div></div>
    </div>
  </div>
  <div id="grid-container">
    <div id="grid"></div>
    <div id="gameOver">
      <h2 id="overTitle">Game Over</h2>
      <button class="restart-btn" id="restartBtn">再来一局</button>
    </div>
  </div>
  <!-- 方向按钮 -->
  <div id="dir-controls">
    <div class="row">
      <button class="dir-btn" data-dir="up" aria-label="上">↑</button>
    </div>
    <div class="row">
      <button class="dir-btn" data-dir="left" aria-label="左">←</button>
      <button class="dir-btn" data-dir="down" aria-label="下">↓</button>
      <button class="dir-btn" data-dir="right" aria-label="右">→</button>
    </div>
  </div>
  <div id="controls">
    <button id="newGameBtn">新游戏</button>
    <select id="levelSelect">
      <option value="0">关卡1 · 4×4 · 目标2048</option>
      <option value="1">关卡2 · 5×5 · 目标4096</option>
      <option value="2">关卡3 · 6×6 · 目标8192</option>
    </select>
    <button id="challengeBtn">无尽挑战</button>
  </div>
  <div id="message">&nbsp;</div>
</div>
<script>
(function() {
  'use strict';

  // ─── 音频系统 ─────────────────────────────────────────────
  let audioCtx = null;
  function ensureAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
  }

  function playTone(freq, duration, type, volume) {
    ensureAudio();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || 'sine';
    osc.frequency.value = freq;
    const now = audioCtx.currentTime;
    gain.gain.setValueAtTime(volume ?? 0.25, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + duration);
  }

  function playMoveSound() { playTone(260, 0.08, 'sine', 0.12); }
  function playMergeSound(val) {
    const freq = 400 + (Math.log2(val) * 80);
    playTone(freq, 0.16, 'triangle', 0.2);
    playTone(freq * 1.5, 0.20, 'sine', 0.1);
  }
  function playFailSound() { playTone(160, 0.35, 'sawtooth', 0.15); }
  function playWinSound() {
    playTone(523, 0.3, 'sine', 0.2);
    setTimeout(() => playTone(659, 0.3, 'sine', 0.2), 150);
    setTimeout(() => playTone(784, 0.4, 'sine', 0.2), 300);
  }

  // ─── 关卡配置 ──────────────────────────────────────────────
  const LEVELS = [
    { size: 4, goal: 2048, label: '关卡1 · 4×4 · 目标2048' },
    { size: 5, goal: 4096, label: '关卡2 · 5×5 · 目标4096' },
    { size: 6, goal: 8192, label: '关卡3 · 6×6 · 目标8192' },
  ];

  // ─── 游戏状态 ──────────────────────────────────────────────
  let grid = [];            // 2D array: null or number
  let tiles = [];          // {id, value, row, col, mergedFrom}
  let score = 0;
  let best = 0;
  let size = 4;
  let goal = 2048;
  let isChallenge = false;
  let gameOver = false;
  let won = false;
  let keepPlaying = false;  // 胜利后继续玩
  let tileCounter = 0;

  // DOM 引用
  const gridEl = document.getElementById('grid');
  const scoreDisplay = document.getElementById('scoreDisplay');
  const bestDisplay = document.getElementById('bestDisplay');
  const messageEl = document.getElementById('message');
  const gameOverEl = document.getElementById('gameOver');
  const overTitle = document.getElementById('overTitle');
  const restartBtn = document.getElementById('restartBtn');
  const newGameBtn = document.getElementById('newGameBtn');
  const levelSelect = document.getElementById('levelSelect');
  const challengeBtn = document.getElementById('challengeBtn');

  // 读取 localStorage 中的 best
  try {
    const saved = localStorage.getItem('2046_best');
    if (saved) best = parseInt(saved, 10) || 0;
  } catch(e) {}

  // ─── 工具函数 ──────────────────────────────────────────────
  function getEmptyCells() {
    const empty = [];
    for (let r = 0; r < size; r++) {
      for (let c = 0; c < size; c++) {
        if (grid[r][c] === null) empty.push({r, c});
      }
    }
    return empty;
  }

  function randomEmptyCell() {
    const empty = getEmptyCells();
    if (empty.length === 0) return null;
    return empty[Math.floor(Math.random() * empty.length)];
  }

  function addRandomTile() {
    const cell = randomEmptyCell();
    if (!cell) return false;
    const value = Math.random() < 0.9 ? 2 : 4;
    tileCounter++;
    const tileObj = { id: tileCounter, value, row: cell.r, col: cell.c, mergedFrom: false };
    tiles.push(tileObj);
    grid[cell.r][cell.c] = value;
    return true;
  }

  // ─── 核心移动逻辑（参考经典2048）────────────────────────
  function moveRowLeft(row) {
    // row: array of numbers (null表示空)
    const newRow = [];
    const merged = [];
    let i = 0;
    while (i < size) {
      if (row[i] === null) { i++; continue; }
      let j = i + 1;
      while (j < size && row[j] === null) j++;
      if (j < size && row[i] === row[j]) {
        const val = row[i] * 2;
        newRow.push(val);
        merged.push(val);
        i = j + 1;
      } else {
        newRow.push(row[i]);
        i++;
      }
    }
    while (newRow.length < size) newRow.push(null);
    return { newRow, merged };
  }

  function moveLeft() {
    let moved = false;
    let totalMerged = 0;
    const mergedValues = [];
    for (let r = 0; r < size; r++) {
      const orig = grid[r].slice();
      const { newRow, merged } = moveRowLeft(orig);
      if (newRow.some((v, i) => v !== orig[i])) moved = true;
      grid[r] = newRow;
      totalMerged += merged.length;
      mergedValues.push(...merged);
    }
    // 重新构建 tiles
    rebuildTilesFromGrid();
    // 音效
    if (totalMerged > 0) {
      for (const v of mergedValues) playMergeSound(v);
      // 更新分数
      const gained = mergedValues.reduce((a,b) => a + b, 0);
      score += gained;
      updateScore();
    } else if (moved) {
      playMoveSound();
    }
    return moved;
  }

  function moveRight() {
    let moved = false;
    let totalMerged = 0;
    const mergedValues = [];
    for (let r = 0; r < size; r++) {
      const orig = grid[r].slice();
      const reversed = orig.slice().reverse();
      const { newRow, merged } = moveRowLeft(reversed);
      const newOrig = newRow.reverse();
      if (newOrig.some((v, i) => v !== orig[i])) moved = true;
      grid[r] = newOrig;
      totalMerged += merged.length;
      mergedValues.push(...merged);
    }
    rebuildTilesFromGrid();
    if (totalMerged > 0) {
      for (const v of mergedValues) playMergeSound(v);
      const gained = mergedValues.reduce((a,b) => a + b, 0);
      score += gained;
      updateScore();
    } else if (moved) {
      playMoveSound();
    }
    return moved;
  }

  function moveUp() {
    let moved = false;
    let totalMerged = 0;
    const mergedValues = [];
    for (let c = 0; c < size; c++) {
      const col = [];
      for (let r = 0; r < size; r++) col.push(grid[r][c]);
      const { newRow, merged } = moveRowLeft(col);
      const newCol = newRow;
      if (newCol.some((v, r) => v !== grid[r][c])) moved = true;
      for (let r = 0; r < size; r++) grid[r][c] = newCol[r];
      totalMerged += merged.length;
      mergedValues.push(...merged);
    }
    rebuildTilesFromGrid();
    if (totalMerged > 0) {
      for (const v of mergedValues) playMergeSound(v);
      const gained = mergedValues.reduce((a,b) => a + b, 0);
      score += gained;
      updateScore();
    } else if (moved) {
      playMoveSound();
    }
    return moved;
  }

  function moveDown() {
    let moved = false;
    let totalMerged = 0;
    const mergedValues = [];
    for (let c = 0; c < size; c++) {
      const col = [];
      for (let r = 0; r < size; r++) col.push(grid[r][c]);
      const reversed = col.slice().reverse();
      const { newRow, merged } = moveRowLeft(reversed);
      const newCol = newRow.reverse();
      if (newCol.some((v, r) => v !== grid[r][c])) moved = true;
      for (let r = 0; r < size; r++) grid[r][c] = newCol[r];
      totalMerged += merged.length;
      mergedValues.push(...merged);
    }
    rebuildTilesFromGrid();
    if (totalMerged > 0) {
      for (const v of mergedValues) playMergeSound(v);
      const gained = mergedValues.reduce((a,b) => a + b, 0);
      score += gained;
      updateScore();
    } else if (moved) {
      playMoveSound();
    }
    return moved;
  }

  function rebuildTilesFromGrid() {
    tileCounter = Math.max(tileCounter, ...tiles.map(t => t.id));
    tiles = [];
    for (let r = 0; r < size; r++) {
      for (let c = 0; c < size; c++) {
        const val = grid[r][c];
        if (val !== null) {
          tileCounter++;
          tiles.push({ id: tileCounter, value: val, row: r, col: c, mergedFrom: false });
        }
      }
    }
  }

  // ─── 检查是否可以移动 ─────────────────────────────────
  function canMove() {
    for (let r = 0; r < size; r++) {
      for (let c = 0; c < size; c++) {
        if (grid[r][c] === null) return true;
        if (c + 1 < size && grid[r][c] === grid[r][c+1]) return true;
        if (r + 1 < size && grid[r][c] === grid[r+1][c]) return true;
      }
    }
    return false;
  }

  function checkWinLose() {
    // 胜利检查
    if (!won && !keepPlaying) {
      for (let r = 0; r < size; r++) {
        for (let c = 0; c < size; c++) {
          if (grid[r][c] !== null && grid[r][c] >= goal) {
            won = true;
            gameOver = true;
            showGameOver('🎉 你赢了！', true);
            playWinSound();
            return;
          }
        }
      }
    }
    // 失败检查
    if (!canMove()) {
      if (!won) {
        gameOver = true;
        showGameOver('😵 Game Over', false);
        playFailSound();
      } else {
        // 胜利后不能移动也结束
        gameOver = true;
        showGameOver('🎉 你赢了！', true);
      }
    }
  }

  function showGameOver(text, isWin) {
    overTitle.textContent = text;
    gameOverEl.classList.add('show');
  }

  function hideGameOver() {
    gameOverEl.classList.remove('show');
  }

  // ─── 操作主函数 ──────────────────────────────────────────
  function processMove(direction) {
    if (gameOver) return false;
    ensureAudio(); // 确保音频解锁

    let moved = false;
    switch (direction) {
      case 'left':  moved = moveLeft();  break;
      case 'right': moved = moveRight(); break;
      case 'up':    moved = moveUp();    break;
      case 'down':  moved = moveDown();  break;
    }
    if (!moved) return false;

    // 添加新块
    addRandomTile();
    // 更新渲染
    render();
    // 检查win/lose
    checkWinLose();
    // 消息更新
    updateMessage();
    return true;
  }

  // ─── 渲染 ──────────────────────────────────────────────────
  function render() {
    const gridRect = gridEl.getBoundingClientRect();
    const containerSize = gridEl.clientWidth;
    const gap = 8;
    const cellSize = (containerSize - gap * (size + 1)) / size;

    // 清除旧tile
    gridEl.innerHTML = '';

    // 背景cell
    for (let r = 0; r < size; r++) {
      for (let c = 0; c < size; c++) {
        const cell = document.createElement('div');
        cell.className = 'tile';
        cell.style.width = cellSize + 'px';
        cell.style.height = cellSize + 'px';
        cell.style.left = (gap + c * (cellSize + gap)) + 'px';
        cell.style.top = (gap + r * (cellSize + gap)) + 'px';
        cell.style.background = 'rgba(238,228,218,0.5)';
        cell.style.borderRadius = '6px';
        cell.style.pointerEvents = 'none';
        cell.style.zIndex = 0;
        gridEl.appendChild(cell);
      }
    }

    // 方块
    tiles.forEach(tile => {
      const el = document.createElement('div');
      el.className = 'tile';
      el.style.width = cellSize + 'px';
      el.style.height = cellSize + 'px';
      el.style.left = (gap + tile.col * (cellSize + gap)) + 'px';
      el.style.top = (gap + tile.row * (cellSize + gap)) + 'px';
      el.textContent = tile.value;
      el.style.fontSize = (cellSize > 60) ? (cellSize * 0.38) + 'px' : '14px';
      el.style.background = tileColor(tile.value);
      el.style.color = tile.value <= 4 ? '#776e65' : '#f9f6f2';
      el.style.fontWeight = '700';
      el.style.zIndex = 1;
      el.style.boxShadow = '0 2px 4px rgba(0,0,0,0.2)';
      el.dataset.tileId = tile.id;
      gridEl.appendChild(el);
    });

    // 触发新块动画
    const newTiles = tiles.filter(t => t.id > tileCounter - 3 && t.value > 0);
    // 安全：总是对最后添加的几个方块加动画
    const allEls = gridEl.querySelectorAll('.tile[data-tile-id]');
    if (allEls.length > 0) {
      const last = allEls[allEls.length - 1];
      last.classList.add('tile-new');
    }
    if (allEls.length >= 2) {
      const prev = allEls[allEls.length - 2];
      // 如果是合并产生的新块（用id追踪）, 简单做
      if (prev.textContent !== '') prev.classList.add('tile-new');
    }
  }

  // 方块颜色
  function tileColor(value) {
    const colors = {
      2: '#eee4da',
      4: '#ede0c8',
      8: '#f2b179',
      16: '#f59563',
      32: '#f67c5f',
      64: '#f65e3b',
      128: '#edcf72',
      256: '#edcc61',
      512: '#edc850',
      1024: '#edc53f',
      2048: '#edc22e',
      4096: '#b0b0b0',
      8192: '#a5a5a5',
    };
    if (value > 8192) return '#909090';
    return colors[value] || '#cdc1b4';
  }

  function updateScore() {
    scoreDisplay.textContent = score;
    if (score > best) {
      best = score;
      try { localStorage.setItem('2046_best', String(best)); } catch(e) {}
    }
    bestDisplay.textContent = best;
  }

  function updateMessage() {
    if (gameOver) {
      if (won) messageEl.textContent = '🎉 恭喜通关！';
      else messageEl.textContent = '😵 无路可走…';
    } else {
      if (isChallenge) messageEl.textContent = '⬆⬇⬅➡ 挑战无尽模式';
      else messageEl.textContent = `目标：${goal} 分`;
    }
  }

  // ─── 初始化和重置 ──────────────────────────────────────
  function initGame(newSize, newGoal, challengeMode) {
    hideGameOver();
    size = newSize;
    goal = newGoal;
    isChallenge = challengeMode;
    gameOver = false;
    won = false;
    keepPlaying = false;
    score = 0;
    tileCounter = 0;
    // 初始化网格
    grid = [];
    for (let r = 0; r < size; r++) {
      grid.push(new Array(size).fill(null));
    }
    tiles = [];
    // 添加两个初始块
    addRandomTile();
    addRandomTile();
    updateScore();
    render();
    updateMessage();
    // 更新选择框
    if (!challengeMode) {
      const idx = LEVELS.findIndex(l => l.size === size && l.goal === goal);
      if (idx >= 0) levelSelect.value = String(idx);
    }
  }

  function resetCurrentLevel() {
    initGame(size, goal, isChallenge);
  }

  // ─── 事件绑定 ──────────────────────────────────────────────
  function handleKey(e) {
    const map = {
      ArrowLeft: 'left',
      ArrowRight: 'right',
      ArrowUp: 'up',
      ArrowDown: 'down',
    };
    const dir = map[e.key];
    if (!dir) return;
    e.preventDefault();
    processMove(dir);
  }

  // 触摸滑动
  let touchStartX = 0, touchStartY = 0;
  function handleTouchStart(e) {
    const touch = e.touches[0];
    touchStartX = touch.clientX;
    touchStartY = touch.clientY;
  }
  function handleTouchEnd(e) {
    const touch = e.changedTouches[0];
    const dx = touch.clientX - touchStartX;
    const dy = touch.clientY - touchStartY;
    const absDx = Math.abs(dx);
    const absDy = Math.abs(dy);
    if (Math.max(absDx, absDy) < 20) return;
    let dir;
    if (absDx > absDy) {
      dir = dx > 0 ? 'right' : 'left';
    } else {
      dir = dy > 0 ? 'down' : 'up';
    }
    processMove(dir);
  }

  // 方向按钮点击
  function handleDirClick(e) {
    const btn = e.currentTarget;
    const dir = btn.dataset.dir;
    if (!dir) return;
    processMove(dir);
  }

  // ─── 挂载 ──────────────────────────────────────────────────
  document.addEventListener('keydown', handleKey);
  gridEl.addEventListener('touchstart', handleTouchStart, { passive: true });
  gridEl.addEventListener('touchend', handleTouchEnd, { passive: true });

  newGameBtn.addEventListener('click', () => {
    ensureAudio();
    resetCurrentLevel();
  });

  levelSelect.addEventListener('change', () => {
    ensureAudio();
    const idx = parseInt(levelSelect.value, 10);
    const level = LEVELS[idx];
    if (level) initGame(level.size, level.goal, false);
  });

  challengeBtn.addEventListener('click', () => {
    ensureAudio();
    initGame(4, 2048, true);
  });

  restartBtn.addEventListener('click', () => {
    ensureAudio();
    resetCurrentLevel();
  });

  // 绑定方向按钮
  document.querySelectorAll('.dir-btn').forEach(btn => {
    btn.addEventListener('click', handleDirClick);
    // 防止双击选中文字
    btn.addEventListener('mousedown', e => e.preventDefault());
  });

  // 启动默认关卡
  const defaultLevel = LEVELS[0];
  initGame(defaultLevel.size, defaultLevel.goal, false);
})();
</script>
</body>
</html>
