<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>用药提醒</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="animations.css">
  <link rel="stylesheet" href="decorations.css">
  <link rel="stylesheet" href="themes.css">
  <link rel="stylesheet" href="sound.css">
</head>
<body>
  <div id="app">
    <header class="app__header">
      <h1>💊 用药提醒</h1>
      <p class="app__subtitle">智能服药管理 · Claude风格</p>
    </header>
    <div id="theme-container"></div>

    <!-- 添加药物 -->
    <section class="card form-card">
      <h2 class="card__title">添加药物</h2>
      <form id="medication-form">
        <div class="form-row">
          <label>药物名称
            <input type="text" id="med-name" placeholder="例如：阿司匹林" required>
          </label>
          <label>剂量
            <input type="text" id="med-dosage" placeholder="例如：100mg" required>
          </label>
        </div>
        <div class="form-row">
          <label>服药时间（24小时制，可多个）
            <input type="text" id="med-times" placeholder="08:00,20:00" required>
          </label>
        </div>
        <div class="form-row">
          <label>日程类型
            <select id="med-schedule-type">
              <option value="daily">每日</option>
              <option value="weekly">每周</option>
              <option value="biweekly">每两周</option>
              <option value="monthly">每月</option>
              <option value="biannual">每半年</option>
              <option value="customDays">自定义星期</option>
              <option value="customInterval">自定义间隔</option>
            </select>
          </label>
          <label class="schedule-extra-row" data-related="weekly,customDays" id="days-label">每周天数（0=周日，逗号分隔）
            <input type="text" id="med-days" placeholder="1,3,5" value="0,1,2,3,4,5,6">
          </label>
        </div>
        <div class="form-row schedule-extra-row" data-related="biweekly,monthly,biannual,customInterval">
          <label>开始日期
            <input type="date" id="med-start-date">
          </label>
        </div>
        <div class="form-row schedule-extra-row" data-related="monthly">
          <label>每月第几天
            <input type="number" id="med-monthly-day" min="1" max="31" placeholder="1">
          </label>
        </div>
        <div class="form-row schedule-extra-row" data-related="customInterval">
          <label>间隔
            <input type="number" id="med-interval-value" min="1" value="2" style="width:60px;">
            <select id="med-interval-unit">
              <option value="day">天</option>
              <option value="week">周</option>
              <option value="month">月</option>
            </select>
          </label>
        </div>
        <!-- hidden fields for biweekly/biannual default values (used by schedule.js) -->
        <input type="hidden" id="med-biweekly-interval" value="2">
        <input type="hidden" id="med-biannual-interval" value="6">
        <button type="submit" class="btn btn--primary">添加</button>
      </form>
    </section>

    <!-- 药物列表 -->
    <section class="card" id="medication-section">
      <h2 class="card__title">已有药物</h2>
      <div id="medication-list"></div>
    </section>

    <!-- 即将服用的剂量 -->
    <section class="card" id="schedule-section">
      <h2 class="card__title">即将服用的剂量</h2>
      <div id="upcoming-doses"></div>
    </section>

    <!-- 服药记录 -->
    <section class="card" id="history-section">
      <h2 class="card__title">服药记录</h2>
      <div id="history-list"></div>
      <div style="margin-top:0.8rem; text-align:right;">
        <button class="btn btn--small btn--danger" onclick="if(confirm('清除所有记录？')){ MedRemLogging.clearHistory(); location.reload(); }">清除记录</button>
      </div>
    </section>

    <!-- 设置 -->
    <section class="card" id="settings-section">
      <h2 class="card__title">设置</h2>
      <div class="toggle-row">
        <span class="toggle-label">声音提醒</span>
        <label class="switch">
          <input type="checkbox" id="toggle-sound" checked>
          <span class="slider"></span>
        </label>
      </div>
      <div class="toggle-row">
        <span class="toggle-label">浏览器通知</span>
        <label class="switch">
          <input type="checkbox" id="toggle-notification" checked>
          <span class="slider"></span>
        </label>
      </div>
    </section>
  </div>

  <script src="medications.js"></script>
  <script src="schedule.js"></script>
  <script src="logging.js"></script>
  <script src="notifications.js"></script>
  <script src="background.js"></script>
  <script src="types.js"></script>
  <script src="animations.js"></script>
  <script src="decorations.js"></script>
  <script src="theming.js"></script>
  <script src="sound.js"></script>
  <script src="main.js"></script>

  <!-- Inline UI logic for schedule field visibility and settings -->
  <script>
    (function () {
      'use strict';

      // Schedule type field visibility
      var scheduleSelect = document.getElementById('med-schedule-type');
      var extraRows = document.querySelectorAll('.schedule-extra-row');

      function updateScheduleVisibility() {
        var type = scheduleSelect.value;
        extraRows.forEach(function (row) {
          var related = (row.getAttribute('data-related') || '').split(',');
          if (related.indexOf(type) !== -1) {
            row.classList.add('is-visible');
          } else {
            row.classList.remove('is-visible');
          }
        });
      }

      scheduleSelect.addEventListener('change', updateScheduleVisibility);
      updateScheduleVisibility(); // initial call

      // Settings toggles
      var toggleSound = document.getElementById('toggle-sound');
      var toggleNotification = document.getElementById('toggle-notification');

      toggleSound.addEventListener('change', function () {
        if (window.MedRemNotifications) {
          window.MedRemNotifications.setSoundEnabled(this.checked);
        }
      });

      toggleNotification.addEventListener('change', function () {
        if (window.MedRemNotifications) {
          window.MedRemNotifications.setNotificationEnabled(this.checked);
        }
      });

      // Background overlay via background.js after modules loaded
      if (window.MedRemBackground) {
        window.MedRemBackground.initBackground('app').catch(function (err) {
          console.warn('Background init failed:', err);
        });
      }
    })();
  </script>
</body>
</html>
