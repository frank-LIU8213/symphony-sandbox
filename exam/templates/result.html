{% extends "base.html" %}
{% block title %}Exam Result{% endblock %}
{% block content %}
<h2>Exam Result</h2>
<div style="text-align: center; margin: 2rem 0; padding: 2rem; background: #f8f9fa; border-radius: 8px;">
    <h1 style="font-size: 3rem; margin: 0; color: #0066cc;">{{ score }}%</h1>
    <p style="font-size: 1.2rem; margin-top: 1rem;">You answered {{ score|round(0, 'floor')|int }} out of {{ total }} questions correctly.</p>
</div>
<a href="{{ url_for('dashboard') }}" class="btn">Back to Dashboard</a>
{% endblock %}
