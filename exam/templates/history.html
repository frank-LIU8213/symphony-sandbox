{% extends "base.html" %}
{% block title %}Exam History{% endblock %}
{% block content %}
<h2>Exam History</h2>
{% if attempts %}
<table>
    <thead>
        <tr>
            <th>Date</th>
            <th>Score</th>
            <th>Total Questions</th>
        </tr>
    </thead>
    <tbody>
        {% for a in attempts %}
        <tr>
            <td>{{ a.created_at }}</td>
            <td>{{ a.score }}%</td>
            <td>{{ a.total }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% else %}
<p>No exams taken yet.</p>
{% endif %}
{% endblock %}
