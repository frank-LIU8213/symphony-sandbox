<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Pomodoro</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="app-background">
    <div class="pomodoro">
      <div class="pomodoro__circle-container">
        <svg id="circle-progress" viewBox="0 0 100 100" class="pomodoro__circle">
          <circle cx="50" cy="50" r="45" fill="none" stroke="#e0e0e0" stroke-width="8"/>
          <circle id="circle-progress-fill" cx="50" cy="50" r="45" fill="none" stroke="#ff6b6b" stroke-width="8"
                  stroke-dasharray="283" stroke-dashoffset="0" stroke-linecap="round"
                  transform="rotate(-90 50 50)"/>
        </svg>
        <div id="timer-display" class="pomodoro__timer">25:00</div>
      </div>
      <div class="pomodoro__controls">
        <button id="btn-start" class="pomodoro__button pomodoro__button--start">Start</button>
        <button id="btn-pause" class="pomodoro__button pomodoro__button--pause">Pause</button>
        <button id="btn-reset" class="pomodoro__button pomodoro__button--reset">Reset</button>
      </div>
      <div class="pomodoro__mode">
        <label for="mode-selector">Session:</label>
        <select id="mode-selector" class="pomodoro__selector">
          <option value="work" selected>Work</option>
          <option value="shortBreak">Short Break</option>
          <option value="longBreak">Long Break</option>
        </select>
      </div>
    </div>
    <audio id="audio-element" preload="auto" style="display:none;"></audio>
  </div>
  <script src="js/settings.js"></script>
  <script src="js/timer.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/animations.js"></script>
  <script src="js/background.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
